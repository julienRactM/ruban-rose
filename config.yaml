# Breast Cancer Detection Configuration

# Data Configuration
data:
  data_path: "data/BHI"
  image_size: [50, 50]
  batch_size: 128  # M4 Pro optimized batch size for larger unified memory
  data_percentage: 0.05  # Use full dataset (0.1 for 10% during development)
  num_workers: 8  # M4 Pro 14-core optimized (will be auto-adjusted by data loader)
  train_split: 0.8
  val_split: 0.2
  
# Class Balancing
class_balance:
  enabled: true
  target_ratio: 0.5  # 50-50 split
  augmentation_ratio: 1  # 100% augmentation, 0% reduction
  strategy: "hybrid"  # hybrid, augmentation_only, reduction_only
  
# Data Augmentation
augmentation:
  enabled: true
  rotation_range: 15
  brightness_range: [0.8, 1.2] 
  contrast_range: [0.8, 1.2]
  horizontal_flip: true
  vertical_flip: false  # Not anatomically appropriate
  gaussian_noise: 0.01
  random_crop: false  # Images are already small patches

# Model Configuration
models:
  cnn:
    enabled: true
    evaluate: 1
    architecture: "custom"
    learning_rate: 0.001
    epochs: 50
    dropout: 0.5
    
  resnet:
    enabled: true  
    evaluate: 1
    architecture: "resnet18"
    pretrained: true
    learning_rate: 0.0001
    epochs: 30
    fine_tune_layers: -1  # -1 for all layers, positive number for top N layers
    
  faster_rcnn:
    enabled: true
    evaluate: 1
    backbone: "resnet50"
    learning_rate: 0.0001
    epochs: 25
    # Note: Faster R-CNN may be overkill for 50x50 patches
    
  vision_transformer:
    enabled: true
    evaluate: 1
    model_name: "vit_base_patch16_224"
    learning_rate: 0.00001
    epochs: 20
    patch_size: 16
    image_size: 224  # ViT requires larger input, will upscale 50x50

# Training Configuration  
training:
  device: "mps"  # M4 Pro optimized for MPS backend
  mixed_precision: true  # Enable for M4 Pro performance boost
  gradient_clipping: 1.0
  patience: 20  # Early stopping patience - increased for medical training
  save_best_only: true
  monitor_metric: "val_f1_score"
  # M4 Pro specific optimizations
  m4_pro_optimizations:
    memory_fraction: 0.85  # Use 85% of unified memory
    enable_graph_mode: true  # Enable MPS graph compilation
    prefetch_factor: 4  # Optimized for M4 Pro memory bandwidth
  
# Evaluation Metrics (Medical Focus)
metrics:
  primary: ["sensitivity", "specificity", "f1_score"]
  secondary: ["accuracy", "precision", "recall", "auc_roc"]
  medical_focus: true  # Emphasize sensitivity over specificity
  
# Hyperparameter Optimization
optuna:
  enabled: false  # Enable after selecting best model
  n_trials: 50  # Reduced for faster M4 Pro optimization cycles
  optimize_metric: "f1_score"
  search_space:
    learning_rate: [1e-5, 1e-2]
    batch_size: [64, 128, 256, 384]  # M4 Pro optimized batch sizes
    dropout: [0.2, 0.7]
  # M4 Pro specific optimization settings
  m4_pro_presets:
    fast_preset:
      n_trials: 15
      timeout: 1800  # 30 minutes
      batch_sizes: [64, 128, 192]
    thorough_preset:
      n_trials: 75
      timeout: 7200  # 2 hours
      batch_sizes: [64, 128, 256, 384]
    medical_preset:
      n_trials: 40
      timeout: 3600  # 1 hour
      batch_sizes: [96, 128, 192, 256]
  
# Logging and Output
logging:
  level: "INFO"
  save_logs: true
  log_file: "logs/training.log"
  tensorboard: true
  
output:
  save_models: true
  save_plots: true
  results_dir: "results"
  model_checkpoint_dir: "models/checkpoints"
  
# Web Interface Configuration
web:
  host: "0.0.0.0"
  port: 8080
  debug: false